<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oracle WMS Cloud – Navigation Trainer</title>
<style>
:root{--bg:#f4f4f2;--pan:#fff;--ink:#222;--mute:#666;--line:#d6d6d0;--hd:#312d2a;--red:#c74634;--side:#fbfaf9;--sel:#fde9e5;--ok:#2d7a4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b1a;--pan:#262524;--ink:#e8e6e3;--mute:#a09c97;--line:#3d3b39;--hd:#121110;--side:#222120;--sel:#4a2a25;--ok:#5cc58a}}
:root[data-theme="dark"]{--bg:#1c1b1a;--pan:#262524;--ink:#e8e6e3;--mute:#a09c97;--line:#3d3b39;--hd:#121110;--side:#222120;--sel:#4a2a25;--ok:#5cc58a}
*{box-sizing:border-box}html,body{height:100%}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 "Segoe UI",Arial,sans-serif;display:flex;flex-direction:column}
header{background:var(--hd);color:#fff;display:flex;align-items:center;gap:14px;padding:8px 14px;flex-wrap:wrap}
header b{font-size:15px}header b i{color:var(--red);font-style:normal}header span{opacity:.75}
header input{margin-left:auto;padding:4px 8px;border:0;border-radius:3px;width:190px;font:inherit}
.wrap{display:flex;flex:1;min-height:0}
aside{width:236px;background:var(--side);border-right:1px solid var(--line);overflow:auto;padding:6px 0;flex-shrink:0}
aside .f{padding:7px 12px;font-weight:600;cursor:pointer}aside .f:before{content:"▸ ";color:var(--mute)}aside .f.o:before{content:"▾ "}
aside a{display:block;padding:4px 12px 4px 30px;cursor:pointer;color:var(--ink)}aside a:hover{background:var(--sel)}aside a.on{background:var(--sel);border-left:3px solid var(--red);padding-left:27px}
main{flex:1;min-width:0;overflow:auto;padding:12px 16px}
.bc{color:var(--mute);margin-bottom:6px}.bc b{color:var(--ink)}
.note{background:var(--pan);border:1px solid var(--line);border-left:4px solid var(--red);padding:8px 12px;margin:0 0 10px}
.tb{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tb button,.bt{font:inherit;padding:4px 11px;border:1px solid var(--line);background:var(--pan);color:var(--ink);border-radius:3px;cursor:pointer}
.tb button:hover{border-color:var(--red)}.tb button.p{background:var(--red);border-color:var(--red);color:#fff}
.gr{background:var(--pan);border:1px solid var(--line);overflow-x:auto}
table{border-collapse:collapse;width:100%}th,td{padding:5px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--bg);font-weight:600}tbody tr{cursor:pointer}tbody tr.s{background:var(--sel)}
.ft{color:var(--mute);padding:5px 2px}
.tabs{display:flex;gap:4px;margin-bottom:10px}.tabs button{border-radius:3px 3px 0 0}.tabs button.on{background:var(--hd);color:#fff;border-color:var(--hd)}
#md{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#md div{background:var(--pan);max-width:520px;width:100%;border-radius:4px;padding:16px;border-top:4px solid var(--red)}
#md h3{margin:0 0 8px;font-size:15px}#md p{margin:0 0 12px;white-space:pre-line}
.ok{color:var(--ok)}
@media(max-width:760px){aside{width:100%;max-height:34vh;border-right:0;border-bottom:1px solid var(--line)}.wrap{flex-direction:column}header input{margin-left:0}}
</style></head><body>
<header><b>ORACLE <i>WMS</i> Cloud</b><span>Navigation trainer</span><span>Company: ACME_US</span><span>Facility: DC01</span><span>User: admin</span><input id="q" placeholder="Search screens" oninput="menu()"></header>
<div class="wrap"><aside id="side"></aside><main id="main"></main></div>
<div id="md" onclick="if(event.target==this)this.style.display='none'"><div><h3 id="mt"></h3><p id="mp"></p><button class="bt" onclick="md.style.display='none'">Close</button></div></div>
<script>
const $=id=>document.getElementById(id);
const S={sc:'ibs',tab:'ui',sel:-1,open:{},
items:[{sku:'WIDGET-A',d:'Blue widget',cls:'FAST'},{sku:'WIDGET-B',d:'Red widget',cls:'SLOW'},{sku:'GADGET-X',d:'Gadget X',cls:'FAST'}],
ibs:[{id:'ASN1001',po:'PO-5001',sku:'WIDGET-A',q:120,st:'Verified'},{id:'ASN1002',po:'PO-5002',sku:'WIDGET-B',q:240,st:'Verified'},{id:'ASN1003',po:'PO-5003',sku:'GADGET-X',q:60,st:'In Transit'}],
inv:[{lpn:'IB4001',sku:'WIDGET-A',q:80,loc:'A-01-01-1',st:'Located',dt:'2026-09-01'}],
ord:[{id:'SO-9001',sku:'WIDGET-A',q:50,al:0,st:'Created'},{id:'SO-9002',sku:'WIDGET-B',q:30,al:0,st:'Created'}],
tk:[],n:5000,t:0,log:[]};
const L=[];['A','B'].forEach(z=>[1,2].forEach(a=>[1,2].forEach(b=>L.push([`${z}-0${a}-0${b}-1`,z=='A'?'Active':'Reserve',z,'Open']))));
L.push(['DOCK-01','Dock','DOCK','Open'],['STAGE-01','Staging','STG','Open']);
const toast=(t,p)=>{$('mt').textContent=t;$('mp').textContent=p;$('md').style.display='flex'};
const sel=()=>S.sel;
const info=(t,p)=>()=>toast(t,p+'\n\n(Simulated here. In the real UI this button opens the described window.)');
// ---- screens: t title, c cols, r rows fn, b buttons [label, fn, primary], n learning note
const SC={
users:{t:'Users',c:['User','Role','Default Printer','Equipment Type'],r:()=>[['admin','Administrator','PRT-01','—'],['supv1','Supervisor','PRT-01','—'],['rfuser1','Operator','PRT-02','Pallet Jack']],b:[['Create',info('Create user','Adds a user, role, default printer and fixed Equipment Type.')],['Edit',info('Edit user','Update role, printer, eligible facilities/companies.')],['Assign Equipment Type',info('Assign Equipment Type','Select an Equipment Type from the drop-down, then click Assign Equipment Type.')]],n:'Users get a role and a group. Groups decide which UI and RF screens the user sees.'},
grp:{t:'Group Configuration',c:['Group','Users','UI Menu','RF Menu'],r:()=>[['WH_ADMIN','admin','Admin UI Menu','Admin RF Menu'],['WH_SUPV','supv1','Supervisor Menu','Supervisor RF'],['WH_OPS','rfuser1','—','Operator RF Menu']],b:[['Create',info('Create group','Define a group, then assign users to it.')],['Assign User',info('Assign user','Select the user to assign the group to.')]],n:'Flow to remember: Screens → Menu Configuration → Group Configuration → user.'},
mnu:{t:'Menu Configuration',c:['Menu','Type','Folders'],r:()=>[['Admin UI Menu','UI',6],['Supervisor Menu','UI',4],['Operator RF Menu','RF',1]],b:[['Details',info('Menu details','Opens the menu so you can split screens into folders and add screens to folders.')]],n:'Select a menu and click Details to arrange screens into folders.'},
scr:{t:'Screens',c:['Screen','Type','Module'],r:()=>[['Inbound Shipments','UI','Inbound'],['Wave Template','UI','Outbound'],['Receive IBLPN','RF','Inbound']],b:[['Generate Screens',info('Generate Screens','Select the screens required for the group. Both UI and RF screens can be added here.'),1]],n:'Screens must be generated here before they can be put on a menu.'},
fac:{t:'Facilities',c:['Facility','Description','Type'],r:()=>[['DC01','Main DC','WMS Managed']],b:[['Create',info('Create facility','')]],n:'A facility is a warehouse. Users get eligible facilities and companies.'},
cmp:{t:'Companies / Company Parameters',c:['Company','Parent','Parameter group'],r:()=>[['ACME_US','ACME_GLOBAL','Receiving, Allocation, Cross-Dock'],['ACME_GLOBAL','—','Defaults']],b:[['Company Parameters',info('Company Parameters','Parameters change behavior, e.g. cross-dock, receiving prompts, allocation.')]],n:'Parent-Child company hierarchy: child companies can inherit setup from the parent.'},
seq:{t:'Sequence Counters',c:['Counter','Prefix','Next number'],r:()=>[['IBLPN','IB','4002'],['OBLPN','OB','8001'],['Wave','WV','101']],b:[['Create',info('Create counter','')]],n:'Auto-generates LPN, wave and other numbers.'},
bar:{t:'Barcode Configuration',c:['Type','Pattern','Maps to'],r:()=>[['IBLPN','IB%','LPN'],['Location','%-%-%-%','Location']],b:[['Create',info('Create barcode','')]],n:'Tells the RF how to interpret a scanned barcode.'},
prn:{t:'Printers',c:['Printer','Type','Facility'],r:()=>[['PRT-01','Label','DC01'],['PRT-02','Label','DC01']],b:[['Create',info('Create printer','')]],n:'Users get a default printer; label printing is triggered by receiving, packing and shipping.'},
inf:{t:'Input Interfaces',c:['Interface','Direction','Format'],r:()=>[['Inbound Shipment','Inbound','CSV/XML'],['Purchase Order','Inbound','CSV/XML'],['Order','Inbound','CSV/XML'],['Inventory Summary','Outbound','CSV']],b:[['Import',info('Import','Upload an Excel/CSV template. Used to load POs, ASNs, orders in batch.')]],n:'Integrations arrive here first, then become records.'},
chg:{t:'Change History',c:['Date','User','Screen','Change'],r:()=>[['2026-10-14','admin','Wave Template','Edited']],b:[],n:'Audit trail for configuration screens.'},
itm:{t:'Item Master',c:['Item','Description','Class'],r:()=>S.items.map(i=>[i.sku,i.d,i.cls]),b:[['Create',info('Create item','')],['Item Detail',info('Item Detail UI','Configure the item: receiving, putaway type, batch/expiry prompts.')]],n:'Item-level configuration controls prompts at receiving (batch, expiry, serial).'},
loc:{t:'Location Master',c:['Location','Type','Zone','Status'],r:()=>L,b:[['Create',info('Create location','')],['Import',info('Import','')]],n:'Locations are Active (pick) or Reserve (bulk). Dock and Staging are special.'},
ptt:{t:'Putaway Types',c:['Putaway Type','Description'],r:()=>[['FAST','Fast movers'],['SLOW','Slow movers']],b:[['Create',info('Create putaway type','Putaway types are assigned in inbound shipment detail or item.')]],n:'Putaway types link items to putaway rules.'},
ptr:{t:'Putaway Rules',c:['Priority','Putaway Type','Location Type','Zone'],r:()=>[['10','FAST','Active','A'],['20','SLOW','Reserve','B']],b:[['Putaway Priorities',info('Putaway Priorities','Sets the order in which rules are tried for System Directed Putaway.')],['Create',info('Create rule','')]],n:'System Directed Putaway reads these rules to suggest a location.'},
lkc:{t:'Lock Codes',c:['Code','Description','Priority'],r:()=>[['QC','Quality hold','1'],['DMG','Damaged','2']],b:[['Create',info('Create lock code','')]],n:'Locked inventory cannot be allocated. Priority decides which lock applies.'},
tty:{t:'Task Types',c:['Task Type','Description','RF Modules'],r:()=>[['PICK-LPN','Full LPN Pull','Pick IBLPN'],['DIST-LPN','Distribute LPN','Distribute LPN'],['CC-LOCATION','Cycle Count Location','CC Location']],b:[['Details',info('Task type details','Shows the RF modules used within the task type.')]],n:'Task types must match the Allocation Mode UOMs of the wave template.'},
tct:{t:'Task Creation Template',c:['Template','Type','Description'],r:()=>[['STD-PICK','Regular','Standard pick'],['CC-DAILY','CC','Cycle count']],b:[['Details',info('Details','Add Task Types with Sequence, Task Type, Destination Zone.')],['Selection Criteria',info('Selection Criteria','Tells the system which locations/inventory to create tasks from.')],['Ordering Criteria',info('Ordering Criteria','Ordering rules for the task type. Break by count, etc.')],['Run Template',info('Run Template','Used for Cycle Count templates, similar to Wave Inquiry.')]],n:'Template Type: Regular for waves, CC for cycle count.'},
wvt:{t:'Wave Template',c:['Wave Template','Allocation Mode','Task Template','Location Type'],r:()=>[['STD-WAVE','LPN then Unit','STD-PICK','Reserve, Active']],b:[['Allocation Mode',info('Allocation Mode','Create the sequence of allocation UOMs (LPNs, Cases, Units) and Location Type (Reserve or Active).')],['Wave Template Searches',info('Wave Template Searches','Filters that pick which orders are included, e.g. order numbers or qty ≥ std case.')],['Details',info('Details','')]],n:'Three parts: Template Search (which orders), Allocation Mode (how), Task Creation Template (tasks).'},
pos:{t:'Purchase Orders',c:['PO','Supplier','Status'],r:()=>[['PO-5001','Supplier1','Open'],['PO-5002','Supplier1','Open'],['PO-5003','Supplier2','Open']],b:[['Create',info('Create PO','')],['Import',info('Batch create via Input Interface','')]],n:'PO header → PO detail. ASNs can be created from the PO screens.'},
ibs:{t:'Inbound Shipments',c:['Shipment','PO','Item','Qty','Status'],r:()=>S.ibs.map(x=>[x.id,x.po,x.sku,x.q,x.st]),b:[['Create',info('Create Inbound Shipment','Manual ASN creation in the UI, or via interface.')],['Details',info('Inbound Shipment Details','Opens detail lines: item, qty, putaway type, lock codes.')],['Receive',()=>{const x=S.ibs[S.sel];if(!x)return toast('Select a row','Click a shipment first.');if(x.st=='Received')return toast('Already received','');x.st='Received';S.inv.push({lpn:'IB'+(++S.n),sku:x.sku,q:x.q,loc:'DOCK-01',st:'Received',dt:'2026-10-14'});toast('Received',x.id+' received. IBLPN IB'+S.n+' created at DOCK-01. Go to Inventory > LPNs and use Suggested Putaway.');render()},1],['Verify',info('Verify','Shipments that need verification are verified before receiving.')]],n:'Select a shipment, click Receive. This creates an IBLPN at the dock.'},
trl:{t:'Trailer',c:['Trailer','Carrier','Status'],r:()=>[['TRL-77','ACME Freight','Checked in']],b:[['Create',info('Create trailer','')]],n:'Trailers link to shipments for dock management.'},
inv:{t:'Inventory',c:['Item','Location','On hand','Status'],r:()=>S.inv.map(i=>[i.sku,i.loc,i.q,i.st]),b:[['Details',info('Inventory detail','')],['Cycle Count',info('Create cycle count','Create tasks by selection or via a CC task template.')]],n:'Inventory ties item + LPN + location + lock. Only unlocked, located stock is allocatable.'},
lpn:{t:'LPNs',c:['LPN','Item','Qty','Location','Status'],r:()=>S.inv.map(i=>[i.lpn,i.sku,i.q,i.loc,i.st]),b:[['Suggested Putaway',()=>{const i=S.inv[S.sel];if(!i)return toast('Select an LPN','');if(i.loc!='DOCK-01')return toast('Already located','Putaway only applies to LPNs at the dock.');const c=S.items.find(x=>x.sku==i.sku).cls,z=c=='FAST'?'A':'B',t=L.filter(l=>l[2]==z)[0];i.loc=t[0];i.st='Located';toast('Suggested Putaway','Putaway type '+c+' → rule priority '+(c=='FAST'?10:20)+' → zone '+z+'. Located at '+t[0]);render()},1],['LPN Detail',info('LPN detail','')]],n:'System Directed Putaway: item putaway type → Putaway Rules → location.'},
cyc:{t:'Cycle Count',c:['Location','Creation Type','Status'],r:()=>[['A-01-01-1','Summary','Pending']],b:[['Create Tasks',info('Cycle Count Task Creation','Create tasks directly or with a CC Task Creation Template.')],['Approval Rule',info('Cycle Count Approval Rule','Variances above threshold need approval.')]],n:'Types: Summary, Item Driven, Opportunistic. Executed on RF.'},
ord:{t:'Orders',c:['Order','Item','Qty','Allocated','Status'],r:()=>S.ord.map(o=>[o.id,o.sku,o.q,o.al,o.st]),b:[['Create',info('Create order','Manual order creation, or via Excel template/input interface.')],['Details',info('Order details','')],['Ship',()=>{const o=S.ord[S.sel];if(!o)return toast('Select an order','');if(o.st!='Packed')return toast('Not ready','Order must be Packed (all tasks completed on RF).');o.st='Shipped';render()},1]],n:'Order lifecycle: Created → Allocated → Picked/Packed → Shipped.'},
wvi:{t:'Wave Inquiry',c:['Wave','Template','Orders','Status'],r:()=>S.log.map(w=>w),b:[['Execute Wave',()=>{const os=S.ord.filter(o=>o.st=='Created');if(!os.length)return toast('Nothing to wave','No orders in Created status.');let m=[];os.forEach(o=>{let need=o.q;S.inv.filter(i=>i.sku==o.sku&&i.st=='Located'&&i.q>0).sort((a,b)=>a.dt>b.dt?1:-1).forEach(i=>{if(need<=0)return;const t=Math.min(need,i.q);i.q-=t;need-=t;o.al+=t;S.tk.push({id:'T'+(++S.t),o:o.id,lpn:i.lpn,loc:i.loc,q:t,st:'Created'})});o.st=o.al>=o.q?'Allocated':(o.al?'Short Allocated':'No Inventory');m.push(o.id+': '+o.al+'/'+o.q)});S.inv=S.inv.filter(i=>i.q>0);S.log.push(['WV'+(100+S.log.length+1),'STD-WAVE',os.length,'Executed']);toast('Wave executed',m.join('\n')+'\n\nAllocated FIFO from Located inventory. Tasks created. Go to Tasks and release them.');render()},1]],n:'Executing a wave allocates orders and creates tasks via the Task Creation Template.'},
alc:{t:'Allocation',c:['Order','Item','Allocated','From'],r:()=>S.tk.map(t=>[t.o,'',t.q,t.loc]),b:[['Details',info('Allocation detail','Shows original allocated quantity.')]],n:'Allocation reserves inventory. Direct allocation can bypass waves.'},
tsk:{t:'Tasks',c:['Task','Order','LPN','From','Qty','Status'],r:()=>S.tk.map(t=>[t.id,t.o,t.lpn,t.loc,t.q,t.st]),b:[['Release',()=>{const t=S.tk[S.sel];if(!t)return toast('Select a task','');if(t.st!='Created')return toast('Not releasable','');t.st='Released';render()},1],['Complete (RF sim)',()=>{const t=S.tk[S.sel];if(!t)return toast('Select a task','');if(t.st!='Released')return toast('Release first','Tasks must be released before RF users can execute them.');t.st='Completed';const o=S.ord.find(x=>x.id==t.o);if(S.tk.filter(x=>x.o==o.id).every(x=>x.st=='Completed'))o.st='Packed';render()}]],n:'Tasks must be released manually (or automatically per template) before they appear on RF.'},
obl:{t:'OBLPNs',c:['OBLPN','Order','Status'],r:()=>S.ord.filter(o=>o.st=='Packed'||o.st=='Shipped').map(o=>['OB-'+o.id,o.id,o.st]),b:[],n:'Outbound LPNs are the packed cartons or pallets.'}};
const F=[['Setup & Admin',['users','grp','mnu','scr','fac','cmp','seq','bar','prn','inf','chg']],['Configuration',['itm','loc','ptt','ptr','lkc','tty','tct','wvt']],['Inbound',['pos','ibs','trl']],['Inventory',['inv','lpn','cyc']],['Outbound',['ord','wvi','alc','tsk','obl']]];
const RF=[['Receive IBLPN','Scan IBLPN, confirm item/qty, scan dock'],['Putaway IBLPN','Scan IBLPN, system suggests location, scan to confirm'],['Pick IBLPN / Distribute LPN','Executes pick tasks by Task Type'],['CC Location / CC Location LPN Scan','Cycle count tasks'],['Pack OBLPN','Pack picked items into cartons'],['Load Trailer','Scan OBLPN onto trailer']];
function menu(){const q=$('q').value.toLowerCase();$('side').innerHTML=F.map(([f,ids])=>{const m=ids.filter(i=>!q||SC[i].t.toLowerCase().includes(q));if(!m.length)return'';const o=S.open[f]!==false||q;return`<div class="f ${o?'o':''}" onclick="S.open['${f}']=${!o};menu()">${f}</div>`+(o?m.map(i=>`<a class="${S.sc==i?'on':''}" onclick="S.sc='${i}';S.sel=-1;render()">${SC[i].t}</a>`).join(''):'')}).join('')+`<div class="f" style="margin-top:8px" onclick="S.sc='rf';render()">RF menu (simulated)</div>`}
function render(){menu();const m=$('main');if(S.sc=='rf'){m.innerHTML=`<div class="bc">RF Menu</div><div class="note">RF screens run on a handheld. Names are approximate and depend on your RF menu configuration.</div><div class="gr"><table><tr><th>RF module</th><th>What the operator does</th></tr>${RF.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div>`;return}
const s=SC[S.sc],f=F.find(x=>x[1].includes(S.sc))[0],rows=s.r();
m.innerHTML=`<div class="bc">${f} › <b>${s.t}</b></div><div class="note">${s.n}</div><div class="tb">${s.b.map((b,i)=>`<button class="${b[2]?'p':''}" onclick="SC['${S.sc}'].b[${i}][1]()">${b[0]}</button>`).join('')}<button onclick="render()">Refresh</button></div><div class="gr"><table><tr>${s.c.map(c=>`<th>${c}</th>`).join('')}</tr>${rows.map((r,i)=>`<tr class="${i==S.sel?'s':''}" onclick="S.sel=${i};render()">${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')||`<tr><td colspan=${s.c.length}>No records. Run the earlier step first.</td></tr>`}</table></div><div class="ft">${rows.length} records · Click a row to select</div>`}
render();
</script></body></html>
